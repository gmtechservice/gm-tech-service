
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171d26">
  <title>G.M. Tech Service | Biglietto da visita</title>
  <meta name="description" content="Installazione e manutenzione di macchine per cantine e caseifici.">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #f3f4f6;
      background: #171d26;
    }
    .biglietto {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: #242c38;
      border: 1px solid #394454;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,.25);
    }
    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #f3f4f6;
      color: #242c38;
      font-size: 40px;
      font-weight: bold;
    }
    h1 { margin: 0 0 12px; font-size: 27px; }
    .attivita {
      margin: 0 0 26px;
      color: #c3ccd8;
      font-size: 15px;
      line-height: 1.6;
    }
    .nome { margin-bottom: 24px; font-size: 18px; font-weight: bold; }
    .pulsante {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 15px 12px;
      border: 1px solid #536174;
      border-radius: 12px;
      background: #303b4a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .principale { background: #e5edf7; color: #192434; }
    .nota { margin: 24px 0 0; color: #aeb8c6; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="biglietto">
    <div class="logo">GM</div>
    <h1>G.M. Tech Service</h1>
    <p class="attivita">Installazione e manutenzione di macchine per cantine e caseifici</p>
    <div class="nome">Gianmarco Ginesu</div>

    <a class="pulsante principale" href="tel:+393505858522">☎ Chiama</a>
    <a class="pulsante" href="mailto:gm.assistenzesardegna@hotmail.com">✉ Invia un'email</a>
    <button class="pulsante principale" type="button" onclick="salvaContatto()">+ Salva il contatto</button>

    <p class="nota">G.M. Tech Service<br>Assistenza tecnica per cantine e caseifici</p>
  </main>

  <script>
    function salvaContatto() {
      const contatto = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:Ginesu;Gianmarco;;;",
        "FN:Gianmarco Ginesu",
        "ORG:G.M. Tech Service",
        "TITLE:Installazione e manutenzione macchine per cantine e caseifici",
        "TEL;TYPE=WORK,VOICE:+393505858522",
        "EMAIL;TYPE=WORK:gm.assistenzesardegna@hotmail.com",
        "END:VCARD"
      ].join("\r\n") + "\r\n";

      const file = new Blob(["\uFEFF", contatto], {
        type: "text/vcard;charset=utf-8"
      });
      const indirizzo = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = indirizzo;
      link.download = "Gianmarco-Ginesu.vcf";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(indirizzo), 1000);
    }
  </script>
</body>
</html>
